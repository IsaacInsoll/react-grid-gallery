name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose approved npm version is ready to announce
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release artifact
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      artifact_name: npm-package-${{ steps.metadata.outputs.version }}
      bootstrap: ${{ steps.metadata.outputs.bootstrap }}
      dist_tag: ${{ steps.metadata.outputs.dist_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up npm
        run: |
          node scripts/install-corepack.mjs
          corepack enable npm
          corepack install
          npm --version

      - name: Validate release metadata
        id: metadata
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Check consumer types
        run: npm run test:types

      - name: Run unit tests
        run: npm test

      - name: Check packed consumer
        run: npm run test:consumer

      - name: Run browser tests
        run: npm run test:browser:container

      - name: Audit dependencies
        run: npm run security:audit

      - name: Build final package
        run: npm run build

      - name: Pack and validate final artifact
        run: node scripts/check-package.mjs --output="$RUNNER_TEMP/release-package.tgz"

      - name: Record final artifact digest
        working-directory: ${{ runner.temp }}
        run: sha512sum release-package.tgz > release-package.tgz.sha512

      - name: Upload checked artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ steps.metadata.outputs.version }}
          path: |
            ${{ runner.temp }}/release-package.tgz
            ${{ runner.temp }}/release-package.tgz.sha512
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish or stage on npm
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: |
          node scripts/install-corepack.mjs
          corepack enable npm
          corepack install
          npm --version

      - name: Download checked artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify checked artifact digest
        working-directory: ${{ runner.temp }}/release-artifact
        run: sha512sum --check release-package.tgz.sha512

      - name: Bootstrap package on npm
        if: needs.validate.outputs.bootstrap == 'true'
        run: >-
          npm publish "$RUNNER_TEMP/release-artifact/release-package.tgz"
          --access public
          --provenance
          --tag "${{ needs.validate.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

      - name: Stage package on npm
        if: needs.validate.outputs.bootstrap != 'true'
        run: >-
          npm stage publish "$RUNNER_TEMP/release-artifact/release-package.tgz"
          --access public
          --tag "${{ needs.validate.outputs.dist_tag }}"

  github-release:
    name: Prepare GitHub Release
    if: github.event_name == 'push'
    needs:
      - publish
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Prepare release notes
        run: node scripts/release-notes.mjs "${{ needs.validate.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"

      - name: Verify bootstrap publication
        if: needs.validate.outputs.bootstrap == 'true'
        run: >-
          node scripts/verify-published-package.mjs
          "${{ needs.validate.outputs.version }}"
          "${{ needs.validate.outputs.dist_tag }}"
          --allow-version-as-latest

      - name: Create public bootstrap release
        if: needs.validate.outputs.bootstrap == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create draft staged release
        if: needs.validate.outputs.bootstrap != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [ "$PRERELEASE" = 'true' ]; then
            prerelease_create=(--prerelease)
            prerelease_edit=(--prerelease)
          else
            prerelease_create=()
            prerelease_edit=(--prerelease=false)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft "${prerelease_edit[@]}" --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease_create[@]}" --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  finalize-github-release:
    name: Announce approved npm release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate release metadata
        id: metadata
        run: node scripts/release-metadata.mjs "${{ inputs.release_tag }}"

      - name: Verify approved npm publication
        run: >-
          node scripts/verify-published-package.mjs
          "${{ steps.metadata.outputs.version }}"
          "${{ steps.metadata.outputs.dist_tag }}"

      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = 'true' ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "$RELEASE_TAG is already public."
          fi
