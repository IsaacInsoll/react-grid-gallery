name: Bug report
description: Report reproducible incorrect behavior.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal repository, sandbox, or clear reproduction steps.
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: '@picr/react-grid-gallery 1.0.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include React, browser, bundler, Node.js, and TypeScript versions where relevant.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other useful details.
